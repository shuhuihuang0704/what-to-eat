name: Sync What to Eat v38 source

on:
  push:
    branches:
      - main
    paths:
      - "source-v38.ready"

permissions:
  contents: write

jobs:
  unpack-source:
    if: github.repository == 'shuhuihuang0704/what-to-eat'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace repository with the v38 source
        shell: bash
        run: |
          cat source-v38.tar.gz.chunk-* > /tmp/source-v38.tar.gz
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name 'source-v38.tar.gz.chunk-*' \
            ! -name source-v38.ready \
            -exec rm -rf {} +
          tar -xzf /tmp/source-v38.tar.gz
          rm -f source-v38.tar.gz.chunk-*
          rm -f source-v38.ready
          rm -f .github/workflows/sync-v38.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync public site source to v38"
          git push origin HEAD:main
